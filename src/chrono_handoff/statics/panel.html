<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chrono-handoff · cue</title>
<!-- Same mark as the desktop shell's icon, and the same file (statics/icon.svg)
     is what generates the .ico/.icns, so the tab and the taskbar cannot drift
     apart.  Relative href on purpose: it resolves against whatever is serving
     the page -- the conductor over HTTP, or the shell's own bundle. -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- Fonts are served locally (see webui.py).  The component must render the
     same on an isolated network as on the open internet, and a hardware cue is
     exactly the kind of thing that runs on an air-gapped bench. -->
<style>
  @font-face{
    font-family:"Inter";font-style:normal;font-weight:300 700;font-display:swap;
    src:url("/fonts/inter-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,
      U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Inter";font-style:normal;font-weight:300 700;font-display:swap;
    src:url("/fonts/inter-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
      U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,
      U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face{
    font-family:"JetBrains Mono";font-style:normal;font-weight:400 600;font-display:swap;
    src:url("/fonts/jbmono-latin.woff2") format("woff2");
  }
</style>
<style>
    /* ===================================================================
       chrono-handoff cue panel

       An instrument, not a web page.  It exists so one person at a bench
       knows, without reading, the exact instant to press something.  That
       single job drives every decision below:

         * the countdown is the largest thing on the surface and nothing
           competes with it
         * the beat rail is the only colour-coded element, because colour
           there carries real information (which beat is GO)
         * one accent for the whole panel -- GO.  There is no second accent
           to dilute it
         * structure is drawn with hairlines, not with nested cards
         * every number is tabular, so a changing digit never shifts its
           neighbours

       Palette: single amber accent on a neutral zinc ramp.  Amber is the
       only hue in the panel, so "amber means act now" survives in every
       theme, in peripheral vision, and on a bad bench monitor.
       =================================================================== */
    :root{
      /* window paint colour + opacity: the theme owns the colour, the
         opacity setting owns the alpha, so the two can never fight. */
      --win-rgb:11,13,17; --win-alpha:1;

      /* surfaces, darkest to lightest.  Elevation is expressed by lightness
         AND by a hairline; never by a drop shadow. */
      --bg:#0b0d11;
      --well:rgba(255,255,255,.045);      /* inputs, the ghost button */
      --raised:rgba(255,255,255,.075);    /* the GO button at rest */
      --card:rgba(21,24,31,.62);          /* the floating card */
      --card-2:rgba(28,32,41,.72);        /* title bar, raised chrome */

      --line:rgba(255,255,255,.10);       /* hairline */
      --line-2:rgba(255,255,255,.18);     /* hairline under the pointer */

      --fg:#f4f4f6;
      --dim:#a8adb9;                      /* secondary */
      --dim2:#787e8c;                     /* tertiary */

      /* The one accent.  Amber = act now.  Its ink is a dark brown so the
         amber surface can stay bright without ever failing contrast. */
      --accent:#ffc247;
      --accent-ink:#251803;
      --accent-dim:rgba(255,194,71,.16);

      /* Semantic state.  Never used decoratively: a colour on this panel
         always means a state, never "this row looks nice". */
      --ok:#4ade80;
      --bad:#f87171;

      --glass-edge:rgba(255,255,255,.09);
      --shadow:0 22px 60px rgba(0,0,0,.58), 0 2px 8px rgba(0,0,0,.4);

      /* ONE radius scale for the whole panel. */
      --r:14px; --r-sm:9px; --r-pill:99px;

      --tb:38px;
      --dur:.16s;
      --ease:cubic-bezier(.2,.7,.3,1);

      --mono:"JetBrains Mono","Cascadia Code","Fira Code",ui-monospace,SFMono-Regular,Consolas,"Noto Sans SC",monospace;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    /* The opacity setting is delivered as --win-alpha by window.py (it sets it
       on documentElement, so it wins over the theme blocks below).  It has to
       be CONSUMED here or the slider is inert: a control that looks live and
       does nothing is worse than no control. */
    html{height:100%;overflow:hidden;
      background:rgba(var(--win-rgb),var(--win-alpha))}
    body{height:100%;overflow:hidden;color:var(--fg);
      font:14.5px/1.5 "Inter","Noto Sans SC","Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
      background:transparent;
      -webkit-user-select:none;user-select:none;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      font-optical-sizing:auto;font-synthesis:none}

    button,input,select,.sw,.grip{cursor:pointer}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

    /* Motion on this panel is functional only: it shows that the beat
       landed, that a press registered, that a surface opened.  Everything
       collapses under prefers-reduced-motion. */
    @media (prefers-reduced-motion: reduce){
      *{transition-duration:.01ms!important;animation-duration:.01ms!important}
    }

    /* ------------------------------------------------------------ shell grid */
    body.shell{display:grid;grid-template-rows:var(--tb) 1fr;padding:10px;gap:0}
    body.shell .stage{
      position:relative;display:flex;flex-direction:column;min-height:0;
      border-radius:var(--r);
      background:var(--card);
      border:1px solid var(--glass-edge);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px) saturate(150%);
      -webkit-backdrop-filter:blur(18px) saturate(150%);
      overflow:hidden;
    }
    /* hairline sheen along the top edge -- reads as a lit glass surface */
    body.shell .stage::before{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 34%);
    }

    /* browser-tab mode: same card, centred, no chrome */
    body:not(.shell){display:flex;align-items:center;justify-content:center;padding:20px}
    body:not(.shell) .stage{width:min(520px,100%);max-height:100%;overflow:auto;
      border-radius:var(--r);background:var(--card);border:1px solid var(--glass-edge);
      box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

    /* ------------------------------------------------------------- title bar */
    #titlebar{display:none;align-items:center;gap:2px;padding-left:14px;
      background:transparent;border-bottom:1px solid var(--line);
      margin:-1px -1px 0;border-radius:var(--r) var(--r) 0 0}
    body.shell #titlebar{display:flex}
    #titlebar .drag{flex:1;display:flex;align-items:center;height:100%;min-width:0}
    #titlebar .name{font-size:12.5px;color:var(--dim2);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;
      transition:color var(--dur) var(--ease)}
    /* The conductor has gone away.  This is the single most important thing
       the chrome can ever say: without it the operator waits for a cue that
       cannot arrive.  Say it in the accent-free danger colour, not in grey. */
    #titlebar .name.bad{color:var(--bad);font-weight:500}
    .wbtn{width:42px;height:100%;border:0;background:transparent;color:var(--dim2);
      display:grid;place-items:center;border-radius:var(--r-sm);
      transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
    .wbtn:hover{background:var(--raised);color:var(--fg)}
    .wbtn:active{transform:scale(.94)}
    .wbtn.close:hover{background:var(--bad);color:#fff}
    .wbtn svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.4;
      fill:none;stroke-linecap:round}

    /* ---------------------------------------------------------------- panel */
    .stage{min-height:0;display:flex;flex-direction:column}
    .panel{flex:1 1 auto;min-height:0;display:grid;
      /* The COLUMN needs the same defence the rows already had.

         Without it the implicit column is `auto`, whose minimum is the largest
         item's min-content width -- and the rail's min-content grows with the
         number of beats (`cells x min-width + (cells-1) x gap`, and gaps do not
         shrink).  Measured in the desktop shell with a 20 s lead: the column
         became 614 px, EVERY child inherited it, and the card stayed 439 px and
         cropped them -- the GO button and every right-aligned metric value.  It
         looked like a styling choice, not a bug.

         `fitRail()` is what actually fixes that case (it caps the rail's
         min-content).  This line is the structural half: a grid item must not be
         able to dictate the container's width, whatever someone adds here next
         (a long unbroken run id, a long instruction string).  Measured: with
         either one alone the shell renders correctly, which is exactly why both
         are here. */
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
      padding:clamp(11px,2.4vmin,20px) clamp(14px,3.4vmin,28px) clamp(12px,2.6vmin,22px);
      gap:clamp(6px,1.4vmin,13px);position:relative;z-index:1}

    /* ------------------------------------------------------------- the head */
    .head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
    .state{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;
      text-transform:uppercase;color:var(--dim2);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;font-weight:500}
    /* The dot is not decoration: green means the panel is live and listening.
       It only pulses while a cue is actually running. */
    .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:none;
      transition:background var(--dur) var(--ease)}
    .dot.live{background:var(--ok)}
    @keyframes pulse{50%{opacity:.35}}
    .dot.live{animation:pulse 1.9s var(--ease) infinite}
    .runid{font:11px/1 var(--mono);color:var(--dim2);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .instr{font-size:clamp(16px,2.7vmin,23px);font-weight:600;line-height:1.3;
      letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis}
    .instr:empty{display:none}
    .guide{font-size:clamp(11px,1.5vmin,13px);color:var(--dim2);line-height:1.5}
    .guide:empty{display:none}
    /* The panel is running in a browser tab because the native window could not
       open.  Stated plainly rather than left for the user to notice, because
       "it opened as a web page" is otherwise indistinguishable from "this is a
       web app".  Uses --accent (amber), not --bad: nothing is broken, the
       measurement is still valid, only the window affordances are missing. */
    .alert{display:flex;align-items:flex-start;gap:8px;
      font-size:clamp(11px,1.5vmin,12.5px);line-height:1.5;
      color:var(--fg);background:var(--accent-dim);
      border:1px solid var(--accent);border-radius:var(--r-sm);
      padding:8px 10px}
    .alert[hidden]{display:none}
    .alert::before{content:"";flex:none;width:6px;height:6px;margin-top:.45em;
      border-radius:50%;background:var(--accent)}

    /* ------------------------------------------------------------ the clock */
    .clockwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:0;gap:clamp(3px,1vmin,10px)}
    #clock{
      font:600 clamp(56px,24vmin,190px)/0.95 "Inter","Noto Sans SC",system-ui,sans-serif;
      letter-spacing:-.05em;
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1;
      color:var(--fg);
      transition:color .12s var(--ease)}
    #clock.go{color:var(--accent)}
    /* Tail (time since GO) is a secondary reading: the action is already over,
       so it must not compete with the countdown it just replaced.  It was
       clamp(32,12vmin,96) -- 55px at 460 wide, i.e. larger than the 4-character
       "+7.9" needs, which pulled the eye away from the meter where the actual
       verdict appears. */
    #clock.tail{color:var(--dim2);font-size:clamp(26px,9vmin,72px)}
    #clock.ready{color:var(--dim);font-size:clamp(32px,13vmin,100px);font-weight:500}
    /* Idle: there is no reading to show.  A 190px "--" renders as two fat
       bars and reads as a broken/loading skeleton, so the placeholder drops
       to a quiet size and lets the line beneath it do the explaining. */
    body.idle #clock{font-size:clamp(26px,8vmin,54px);font-weight:500;
      letter-spacing:0;color:var(--dim2)}
    .phase{font-size:clamp(11px,1.55vmin,13.5px);color:var(--dim2);
      font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
    /* GO is the only moment the phase line is allowed to shout. */
    .phase.go{color:var(--accent);font-weight:600}
    /* Idle-only.  Hidden the moment a cue exists, so it never competes with
       the countdown or the phase line. */
    .hint{font-size:clamp(11px,1.5vmin,13px);color:var(--dim2);
      text-align:center;max-width:34ch;line-height:1.5}
    body:not(.idle) .hint{display:none}

    /* --------------------------------------------------------------- beats */
    /* The rail IS the instrument: one cell per beat, the GO cell accented,
       the elapsed cells filled.  Height is the only thing that moves, so it
       stays readable at a glance from across a bench. */
    /* GO is pinned to the CENTRE of the rail.  The grid is a timeline, so with
       uneven lead/tail the target drifts off-centre (measured: 28.6px, ~0.87
       cell, at lead 7 / tail 5).  For an instrument that is wrong for two
       reasons: the operator has to re-find the target every run instead of
       catching it in peripheral vision, and a near-miss looks like a layout
       bug.  buildGrid() pads the short side with invisible spacers so the GO
       cell always lands mid-rail. */
    #grid{display:flex;align-items:center;justify-content:center;
      gap:var(--rail-gap,clamp(4px,1vmin,9px));height:clamp(28px,6.6vmin,54px);flex:none;
      padding:0 2px;min-width:0}
    /* min-width is driven by fitRail(): one cell per beat means the rail's
       natural width grows without bound, so it is computed to fit the card
       rather than allowed to overflow it.  See fitRail() for why. */
    .cell{flex:1 1 0;min-width:var(--cell-min,3px);max-width:24px;height:24%;border-radius:var(--r-pill);
      background:var(--well);
      transition:background .08s linear,height .08s linear}
    /* Invisible, same flex maths as a beat: it only exists to balance the rail
       so the GO cell sits at the centre.  It carries no data-idx, and tick()
       skips it, so it can never be mistaken for a beat. */
    .spacer{flex:1 1 0;min-width:var(--cell-min,3px);max-width:24px;height:0}
    /* The GO beat is a POSITION, not only an event: it has to be findable for
       the whole countdown, otherwise the operator learns where the target was
       only after it has gone.  Before GO it reads as an outlined target;
       once it fires it fills solid. */
    .cell.accent{background:var(--accent-dim);height:52%;
      box-shadow:inset 0 0 0 1px var(--accent)}
    .cell.past{background:rgba(255,255,255,.26)}
    .cell.now{background:var(--fg);height:74%}
    /* Tail beats (after GO) only sustain the pulse, so they are held back and
       must not compete with the moment.  tick() added this class from the
       start but no rule ever styled it. */
    .cell.tail{height:18%;background:transparent;
      box-shadow:inset 0 0 0 1px var(--line)}
    .cell.accent.past,.cell.accent.now{background:var(--accent);height:100%;
      box-shadow:none}
    .cell.tail.now{height:52%;background:var(--dim2)}

    /* ------------------------------------------------------------- actions */
    .actions{display:grid;gap:clamp(7px,1.5vmin,12px)}
    /* The primary control.  Rest = neutral raised surface, accent = GO,
       green = the press registered.  Its contrast is checked in all three. */
    #press{
      width:100%;border:1px solid var(--line);border-radius:var(--r);
      padding:clamp(12px,3.2vmin,26px) 16px;
      font-size:clamp(15px,2.8vmin,25px);font-weight:600;letter-spacing:.02em;
      color:var(--fg);background:var(--raised);
      /* colour is deliberately NOT transitioned: the instant the button turns
         GO-amber or press-green is exactly when its label must be readable,
         and a 160ms cross-fade leaves it mid-grey over the new fill.  The
         surface fades, the text snaps. */
      transition:transform var(--dur) var(--ease),background var(--dur) var(--ease),
                 border-color var(--dur) var(--ease)}
    #press:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:var(--line-2);
      transform:translateY(-1px)}
    #press:active:not(:disabled){transform:translateY(0) scale(.995)}
    #press.beat{border-color:var(--line-2)}
    #press.go{background:var(--accent);color:var(--accent-ink);
      border-color:var(--accent)}
    #press.hit{background:var(--ok);color:#04220f;border-color:var(--ok)}
    #press:disabled{opacity:.42;transform:none;cursor:not-allowed}
    /* A registered press is ALSO disabled (the cue is over).  The blanket
       :disabled opacity must not dim it: "your press landed" is the one
       reading the operator must be able to see at a glance, and at 42% it
       washed out to pale green with near-invisible text. */
    #press.hit:disabled{opacity:1}

    .row{display:flex;gap:clamp(7px,1.5vmin,10px)}
    .ghost{flex:1;padding:clamp(8px,1.6vmin,12px);border-radius:var(--r-sm);
      font-size:clamp(11.5px,1.5vmin,13px);font-weight:500;color:var(--dim);
      background:transparent;border:1px solid var(--line);
      transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
                 border-color var(--dur) var(--ease)}
    .ghost:hover{background:var(--raised);color:var(--fg);border-color:var(--line-2)}
    .ghost:active{transform:scale(.99)}

    /* --------------------------------------------------------------- meter */
    /* Telemetry, not content.  It is deliberately the quietest block on the
       surface: mono numerals, no boxes, one hairline to separate it from the
       controls.  The operator reads it once to confirm alignment, then
       ignores it. */
    .meter{border-top:1px solid var(--line);padding-top:clamp(7px,1.3vmin,12px);
      display:grid;gap:clamp(2px,.6vmin,5px);
      font-size:clamp(10.5px,1.4vmin,12.5px)}
    .m{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      color:var(--dim2);min-width:0}
    .m span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap}
    .m b{flex:0 1 auto;min-width:0;color:var(--dim);font-weight:500;
      font-family:var(--mono);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;text-align:right;
      font-variant-numeric:tabular-nums}
    /* .ok / .bad are applied by the timing core.  Declared here so the two
       names the JS already uses actually exist. */
    .ok,.good{color:var(--ok)!important}
    .bad{color:var(--bad)!important}

    /* ------------------------------------------------------------ settings */
    #settings{display:none;flex:1 1 auto;min-height:0;position:relative;z-index:1}
    body.settings-open #settings{display:flex}
    body.settings-open .panel{display:none}
    .sheet{flex:1;min-height:0;overflow:auto;
      padding:clamp(13px,2.6vmin,20px) clamp(16px,3.2vmin,26px) clamp(18px,3.2vmin,28px)}
    .sheet h2{font-size:clamp(13px,2vmin,16px);font-weight:600;margin-bottom:14px;
      letter-spacing:-.01em}
    .grp{border-top:1px solid var(--line);padding:13px 0 5px}
    .grp:first-of-type{border-top:0;padding-top:0}
    /* Section label in the settings sheet.  This is the ONLY place the panel
       uses a small-caps micro-label, because a settings sheet genuinely has
       groups that need naming.  It is not used above the headline. */
    .grp h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--dim2);margin-bottom:11px;font-weight:600}
    .f{display:flex;align-items:center;gap:12px;margin-bottom:10px;
      font-size:clamp(11.5px,1.5vmin,13.5px)}
    .f label{flex:1;color:var(--dim)}
    .f .v{min-width:54px;text-align:right;font-family:var(--mono);
      font-size:.92em;color:var(--dim2);font-variant-numeric:tabular-nums}

    /* form controls: label above, value beside.  Every one of them is
       legible against the sheet surface in all three themes. */
    input[type=range]{width:clamp(84px,17vmin,150px);accent-color:var(--accent);
      background:transparent}
    input[type=number],input[type=text],select{
      width:clamp(74px,14vmin,106px);background:var(--well);color:var(--fg);
      border:1px solid var(--line);border-radius:var(--r-sm);
      padding:6px 9px;font-size:.95em;font-family:var(--mono);
      font-variant-numeric:tabular-nums;
      transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
    input[type=number]::placeholder,input[type=text]::placeholder{color:var(--dim2)}
    input[type=number]:hover,select:hover{border-color:var(--line-2)}
    input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-dim)}
    input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
    .note{font-size:.88em;color:var(--dim2);margin:4px 0 9px;line-height:1.55}
    .sheet .row{margin-top:16px}

    .swatches{display:flex;gap:8px}
    .sw{flex:1;padding:9px 6px;border-radius:var(--r-sm);font-size:.9em;font-weight:500;
      text-align:center;border:1px solid var(--line);background:transparent;
      color:var(--dim);
      transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
                 border-color var(--dur) var(--ease)}
    .sw:hover{background:var(--raised);color:var(--fg)}
    .sw[aria-pressed=true]{border-color:var(--accent);color:var(--fg);
      background:var(--accent-dim)}

    /* --------------------------------------------------------------- themes */
    /* One accent per theme, held constant across the whole panel.  Light and
       amber are not "different websites" -- they are the same instrument
       under different bench lighting, so the geometry and the accent
       semantics never move. */
    body.theme-light{--win-rgb:242,243,246;--win-alpha:1;
      --bg:#f2f3f6;
      --well:rgba(15,17,21,.045);--raised:rgba(15,17,21,.075);
      --card:rgba(255,255,255,.76);--card-2:rgba(255,255,255,.9);
      --line:rgba(15,17,21,.10);--line-2:rgba(15,17,21,.22);
      --fg:#14161b;--dim:#4c5261;--dim2:#6c7382;
      /* the accent darkens so it can carry dark ink; the HUE is identical
         to dark mode, which is what makes "amber = act now" portable */
      --accent:#b45309;--accent-ink:#fff8ec;--accent-dim:rgba(180,83,9,.14);
      --ok:#15803d;--bad:#b91c1c;
      --glass-edge:rgba(255,255,255,.8);

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const POLL_MS = 1500;

/* ------------------------------------------------------ where the server is
   Every request the page makes goes through apiURL(), so the conductor's
   location is written down exactly once.

   In browser mode the page is served *by* the conductor, so the base is empty
   and the URL stays relative.  A shell that bundles the page (Tauri) has an
   origin of its own instead, and the shell announces the conductor's base in
   __CHRONO_API_BASE__; without this, /api/* would be requested from the bundle
   and 404.  Fonts need no such treatment -- they ship inside the bundle.
   See docs/shell-contract.md. */
function apiURL(path) { return (window.__CHRONO_API_BASE__ || "") + path; }

/* ------------------------------------------------------------------ state */
const S = {
  offsetMs: null,        // server_wall − client_wall  (ms)
  bestRtt: Infinity,
  runId: null,
  finished: null,        // run id whose outcome is decided but tail may still play
  sched: null,           // {beats:[{index, at_ms, accent,...}], ...}
  panelObserved: true,   // is THIS panel the evidence source, or just a reminder
  zeroMs: null,          // client-clock epoch ms of the GO beat
  audioStart: null,      // AudioContext time of the GO beat
  ac: null,
  scheduled: [],
  pressed: false,
  lastSeq: 0,
  generation: 0,
  armedNotified: false,
};

/* ------------------------------------------------------------ clock sync */
/* NTP-style: we cannot know the offset without the round trip, and the round
   trip is not symmetric.  Taking the sample with the SMALLEST RTT is the
   standard trick — it is the one least polluted by scheduling delay.        */
async function syncClock(samples = 7) {
  let best = null;
  for (let i = 0; i < samples; i++) {
    const t0 = performance.timeOrigin + performance.now();
    let r;
    try { r = await (await fetch(apiURL("/api/clock"), { cache: "no-store" })).json(); }
    catch { break; }
    const t1 = performance.timeOrigin + performance.now();
    const rtt = t1 - t0;
    // server wall at our t1 ≈ what it received + half the round trip
    const serverAtT1 = r.server_recv_wall * 1000 + rtt / 2;
    if (best === null || rtt < best.rtt) best = { rtt, offset: serverAtT1 - t1 };
  }
  if (best) {
    S.offsetMs = best.offset;   // server_wall = client_wall + offsetMs
    S.bestRtt = best.rtt;
    $("m-offset").textContent = fmtSigned(best.offset) + " ms";
    $("m-rtt").textContent = best.rtt.toFixed(1) + " ms";
    // One rule for the whole telemetry strip: green = this check passed,
    // red = it failed, neutral = not measured yet.  Applied identically to
    // the clock-offset and audio rows so the strip can be scanned in one
    // pass instead of read row by row.
    $("m-offset").className = Math.abs(best.offset) < 1000 ? "good" : "bad";
  }
  return S.offsetMs;
}
const toClient = (serverWallMs) => serverWallMs - S.offsetMs;
const toServer = (clientMs) => clientMs + S.offsetMs;
const fmtSigned = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1);

/* ---------------------------------------------------------------- audio */
/* Sample-accurate scheduling: every beat is handed to the Web Audio clock in
   one batch, so beat-to-beat accuracy never depends on JS timers, rAF, or the
   network.  This is the whole reason the schedule is fetched in one shot.   */
function primeAudio() {
  if (S.ac) return S.ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  S.ac = new AC();
  return S.ac;
}
function anchor() {
  // bridge the two clocks: AudioContext time <-> performance time
  return { ac: S.ac.currentTime, perf: performance.now() };
}
function click(freq, dur, when) {
  const ac = S.ac;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  const t = Math.max(when, ac.currentTime + 0.001);
  const fade = 0.004;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.5, t + fade);
  gain.gain.setValueAtTime(0.5, t + Math.max(fade, dur - fade));
  gain.gain.linearRampToValueAtTime(0, t + dur);
  osc.connect(gain).connect(ac.destination);
  osc.start(t); osc.stop(t + dur + 0.01);
  return osc;
}
function scheduleCue() {
  if (!S.sched || !S.sched.beats.length) return 0;
  // Guard against re-scheduling the same cue.  Without this, any caller that
  // touches scheduleCue() again (long-poll re-entry, clock re-sync, a settings
  // push) would add a SECOND set of oscillators for the same beats and the
  // human would hear every beat twice -- which destroys exactly the rhythmic
  // reference the cue is supposed to provide.
  if (S.schedFor === S.runId && S.scheduled.length > 0) return S.scheduled.length;
  S.schedFor = S.runId;
  const ac = primeAudio();
  if (ac.state === "suspended") ac.resume();
  const a = anchor();
  const perfToAc = (perfMs) => a.ac + (perfMs - a.perf) / 1000;

  S.scheduled.forEach(n => { try { n.stop(); } catch {} });
  S.scheduled = [];
  let n = 0, skipped = 0;
  const lastBeatMs = S.sched.beats.reduce((a, b) => Math.max(a, b.at_ms), 0);
  for (const b of S.sched.beats) {
    const clientMs = toClient(b.at_ms);
    const perfMs = clientMs - performance.timeOrigin;
    const when = perfToAc(perfMs);
    if (when < ac.currentTime) {
      // Only a mid-grid beat is a defect; the grid origin slipping past during
      // arming is expected and flagged on every cue otherwise.
      if (b.at_ms < lastBeatMs - 1) skipped++;
      continue;
    }
    const osc = click(b.accent ? 1568 : 880, b.accent ? 0.09 : 0.035, when);
    if (osc) S.scheduled.push(osc);
    b._whenAc = when;
    n++;
  }
  S.audioStart = S.sched.zero_wall_ms ? perfToAc(toClient(S.sched.zero_wall_ms) - performance.timeOrigin) : null;
  $("m-audio").textContent = `${n} scheduled${skipped ? `, ${skipped} skipped` : ""}`;
  $("m-audio").className = skipped ? "bad" : "good";
  return n;
}

/* ------------------------------------------------------------------ grid */
/* Make the rail fit the card.

   The rail renders one cell per beat, so its natural width grows without bound
   -- a 20 s lead at the 500 ms default is 47 beats, and the padding that keeps
   GO centred doubles that.  Cells have min-width and the gap is a length that
   does NOT shrink, so the rail's min-content width can far exceed the card:
   81 cells wanted 611 px inside a ~390 px content box.

   That used to be invisible as a rail problem, because the grid column grew to
   the rail's min-content and dragged every sibling with it (`grid-template-
   columns:minmax(0,1fr)` now stops that).  With the column capped, the rail is
   the only thing left to fix, and it has to fit for real: a rail whose right
   half is clipped loses the tail AND, worse, can push GO off screen -- and GO is
   a POSITION the operator has to be able to find for the whole countdown.

   So the gap is computed from the available width and the cell count, and if
   even a 1 px gap does not fit, the cells themselves give way.  Only when that
   still cannot fit (a plan in the hundreds of beats) is it reported, because
   silently clipping an instrument is the one outcome that must not be quiet. */
const RAIL = { minCell: 3, minGap: 1, maxGap: 9, floorCell: 1 };

function fitRail() {
  const g = $("grid");
  const cells = g.children.length;
  if (!cells) return;
  const avail = g.clientWidth - 4;            // #grid has 2px padding each side
  if (avail <= 0) return;                     // not laid out yet

  // Skip work that cannot change anything.  This also makes the ResizeObserver
  // below safe: fitRail only writes CSS custom properties, so the grid's own box
  // should not move and the observer should not re-fire -- but "should not" is
  // not a guarantee, and "no-op when nothing changed" makes a feedback loop
  // impossible rather than merely unlikely.
  if (g._fitW === avail && g._fitN === cells) return;
  g._fitW = avail; g._fitN = cells;

  let gap = RAIL.maxGap;
  if (cells > 1) {
    gap = Math.max(RAIL.minGap,
                   Math.min(RAIL.maxGap, (avail - cells * RAIL.minCell) / (cells - 1)));
  }
  // If minGap still does not fit, the cells give way too.
  const cell = Math.max(
    RAIL.floorCell,
    Math.min(RAIL.minCell, (avail - (cells - 1) * gap) / cells));

  g.style.setProperty("--rail-gap", gap.toFixed(2) + "px");
  g.style.setProperty("--cell-min", cell.toFixed(2) + "px");

  const needed = cells * cell + (cells - 1) * gap;
  if (needed > avail + 1) {
    // Loud on purpose, and only when it actually happens.
    try {
      shellCall("page_note", "rail cannot fit: " + cells + " beats need "
                + Math.round(needed) + "px but only " + Math.round(avail)
                + "px is available; the rail is clipped");
    } catch (_) {}
    console.warn("rail overflow", { cells, needed, avail });
  }
}

function buildGrid() {
  const g = $("grid"); g.innerHTML = "";
  if (!S.sched) return;
  const beats = S.sched.beats;
  const go = beats.findIndex(b => b.accent);  // Balance the rail around the GO beat so the target always sits at the
  // centre, whatever lead/tail the settings produce.  Defaults (6 lead, 6
  // tail) are already symmetric; a 7/5 split is not, and the drift is what
  // made the accent look "not centred".
  const before = go < 0 ? 0 : go;
  const after = go < 0 ? 0 : beats.length - 1 - go;
  const padBefore = Math.max(0, after - before);
  const padAfter = Math.max(0, before - after);
  const spacer = () => {
    const s = document.createElement("div");
    s.className = "spacer";
    return s;
  };
  for (let i = 0; i < padBefore; i++) g.appendChild(spacer());
  for (const b of beats) {
    const d = document.createElement("div");
    d.className = "cell" + (b.accent ? " accent" : "");
    d.dataset.idx = b.index;
    g.appendChild(d);
  }
  for (let i = 0; i < padAfter; i++) g.appendChild(spacer());
  fitRail();
  // Measured on the next frame: fitRail() has only just written the custom
  // properties, and reading layout in the same tick would report the old box.
  requestAnimationFrame(guardClipping);
}

/* Never clip silently.

   `.stage` has overflow:hidden for its rounded corners, which means any layout
   mistake inside it shows up as content that is simply *missing* -- no
   scrollbar, no error.

   Honest note on what this can and cannot see: it compares the card's
   scrollWidth/Height against its client size, and while that did report the
   original break in the desktop shell (card 439 px, content 630 px), it did NOT
   report the same break in pywebview (439/439 with cells visibly past the edge).
   So it is a coarse guard, not the real one -- the measurement that catches a
   rail overflow is where the CELLS land, which is what scripts/e2e_ui_layout.py
   now asserts directly.  Kept because a genuinely taller card is a real failure
   mode this does catch. */
let _clipReported = "";
function guardClipping() {
  const st = document.querySelector(".stage");
  if (!st) return;
  const bad = [];
  if (st.scrollWidth > st.clientWidth + 1)
    bad.push("width " + st.scrollWidth + " > " + st.clientWidth);
  if (st.scrollHeight > st.clientHeight + 1)
    bad.push("height " + st.scrollHeight + " > " + st.clientHeight);
  const msg = bad.join(", ");
  if (msg && msg !== _clipReported) {
    _clipReported = msg;
    try { shellCall("page_note", "card is clipping its content: " + msg); } catch (_) {}
    console.warn("card clipping", msg);
  } else if (!msg) {
    _clipReported = "";
  }
}

/* ----------------------------------------------------------- render loop */
function tick() {
  requestAnimationFrame(tick);
  if (!S.sched || !S.sched.beats.length || S.zeroMs === null) return;
  const now = performance.timeOrigin + performance.now();
  const beats = S.sched.beats;
  const first = toClient(beats[0].at_ms), zero = S.zeroMs;
  const last = toClient(beats[beats.length - 1].at_ms);

  // A run's OUTCOME can be decided while its grid is still sounding the tail:
  // run_end fires the moment the human signal lands, but the pulse deliberately
  // plays on (that is what keeps the operator entrained instead of reacting to
  // a one-off event).  So tear the display down only after the last beat has
  // actually passed.  Doing it on run_end blanked the rail while the audio kept
  // beeping at nothing, and the next frame repainted a stale "+2.7" over the
  // idle copy, so both states showed at once.
  if (S.finished === S.runId && now > last + 400) { goIdle(); return; }

  // which beat are we nearest to / just after
  let idx = -1;
  for (let i = 0; i < beats.length; i++) { if (toClient(beats[i].at_ms) <= now) idx = i; }
  const next = beats[idx + 1] || null;

  for (const el of $("grid").children) {
    // Balance spacers carry no beat index; they are pure layout.
    if (el.dataset.idx === undefined) continue;
    const b = beats[+el.dataset.idx];
    const t = toClient(b.at_ms);
    const cls = ["cell"];
    // The accent mark is what makes the target findable BEFORE it arrives.
    if (b.accent) cls.push("accent");
    // Tail beats (after GO) only sustain the pulse; hold them back.
    if (t > zero) cls.push("tail");
    if (t <= now) cls.push("past");
    if (next && b.index === next.index) cls.push("now");
    const nextCls = cls.join(" ");
    // Only touch the DOM when it actually changed: this runs every frame.
    if (el.className !== nextCls) el.className = nextCls;
  }

  /* Ordered by time.  The previous version tested `nextBeat > GO` to decide
     "still counting down", which is false for every beat before GO, so during
     the countdown it fell through to the tail branch and rendered
     `"+" + negative` -- i.e. "+-3.2".  The number the operator reads most was
     the one that was broken. */
  const clockEl = $("clock"), phaseEl = $("phase");
  const sinceZero = now - zero;

  let left = 0;
  for (const b of beats) {
    if (!b.accent && toClient(b.at_ms) > now && toClient(b.at_ms) <= zero) left++;
  }

  function paint(text, cls, phase) {
    if (clockEl.textContent !== text) clockEl.textContent = text;
    if (clockEl.className !== cls) clockEl.className = cls;
    if (phaseEl.textContent !== phase) phaseEl.textContent = phase;
  }

  if (now < first) {
    paint("准备", "clock ready", "还有 " + ((first - now) / 1000).toFixed(1) + " 秒开始");
  } else if (sinceZero < -0.02) {
    paint(String(left).padStart(2, "0"), "clock",
          "距 GO " + left + " 拍 · " + ((-sinceZero) / 1000).toFixed(2) + " 秒");
  } else if (sinceZero <= 300) {
    paint("GO", "clock go", "就是现在");
    phaseEl.classList.add("go");
  } else {
    paint("+" + (sinceZero / 1000).toFixed(1), "clock tail", "已过目标时刻");
  }
  if (sinceZero > 300 || now < first) phaseEl.classList.remove("go");

  pulseButton(now);
}


/* ----------------------------------------------------------------- input */
/* Back to "no cue".  The measured result stays in the meter row, so the panel
   is not lying about what happened -- only the big reading goes back to "no
   cue" instead of freezing on a stale tail number. */
function goIdle() {
  document.body.classList.add("idle");
  $("clock").textContent = "--";
  $("clock").className = "clock";
  $("phase").textContent = "";
  $("phase").classList.remove("go");
  $("grid").innerHTML = "";
  $("press").classList.remove("go", "beat", "hit");
  $("press").hidden = false;
  $("press").textContent = "GO 时按下";
  $("press").disabled = true;
  $("start").hidden = true;
  // Clearing these is what stops tick() from repainting over the idle state.
  S.sched = null;
  S.zeroMs = null;
}

async function doPress(ev) {
  if (S.pressed || !S.sched || S.finished === S.runId) return;
  if (!S.panelObserved) return;   // a sensor owns this run's evidence
  S.pressed = true;
  const clientMs = performance.timeOrigin + performance.now();   // click-handler time
  $("press").classList.add("hit");
  $("press").disabled = true;
  try {
    const r = await (await fetch(apiURL("/api/press"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        run_id: S.runId, payload: "space",
        client_wall_ms: clientMs, clock_offset_ms: S.offsetMs,
      }),
    })).json();
    if (r.ok && typeof r.offset_ms === "number") {
      const v = r.offset_ms;
      $("m-result").textContent = fmtSigned(v) + " ms (" + (v < 0 ? "提前" : "滞后") + ")";
      $("m-result").className = Math.abs(v) < 80 ? "good" : "";
      $("press").textContent = "已记录";
    } else {
      $("m-result").textContent = r.error || "未记录";
      $("m-result").className = "bad";
      $("press").textContent = "未记录";
    }
  } catch (e) {
    $("m-result").textContent = "发送失败";
    $("m-result").className = "bad";
  }
  // The green confirmation STAYS until the next cue.  It used to clear after
  // 700ms, which left the operator wondering whether the press registered at
  // all -- the one question the button exists to answer.
  setTimeout(() => { S.pressed = false; }, 700);
}

/* ------------------------------------------------------------------- cue */
async function applySchedule(sched) {
  S.sched = sched;
  S.runId = sched.run_id;
  S.zeroMs = sched.zero_wall_ms ? toClient(sched.zero_wall_ms) : null;
  S.pressed = false;
  S.lastSeq = 0;
  S.schedFor = null;          // a genuinely new cue -> schedule it for real
  S.finished = null;          // a new cue clears the "tail is over" latch
  pulseButton._i = -1;        // beat index is per-run; stale value muting beat 0
  clearTimeout(pulseButton._t);

  $("runid").textContent = sched.run_id || "--";
  $("instruction").textContent = sched.instruction || "Act now";
  document.body.classList.remove("idle");
  $("state").textContent = "提示已就绪";
  $("live").classList.add("live");

  // The reminder and the evidence are two different things.  This panel is the
  // observation surface only when the run says so; when a real sensor owns the
  // evidence (a serial prompt, a console key), the operator's job is the
  // physical action in the instruction -- pressing THIS button would not count
  // and must not be presented as if it would.
  const observedBy = (sched.expect_source || "none").split(":")[0];
  const panelObserved = ["", "none", "http", "inject"].includes(observedBy);
  S.panelObserved = panelObserved;

  $("press").disabled = !panelObserved;
  $("press").textContent = panelObserved ? "GO 时按下" : "按上面说的做";
  $("press").classList.remove("hit", "go", "beat");
  $("press").hidden = !panelObserved;
  // The manual-start affordance belongs to the armed state only.  Leaving it
  // up once the cue is running shows the operator a control that would do
  // nothing (the run is already going).
  $("start").hidden = true;
  $("m-result").textContent = "--";
  $("m-result").className = "";
  $("m-beats").textContent = `${sched.beats.length} beats · ioi ${sched.ioi_ms} ms`
    + (sched.target_wall_ms ? ` · GO at ${new Date(sched.target_wall_ms).toLocaleTimeString()}` : "");
  buildGrid();
  const n = scheduleCue();
  if (panelObserved) {
    $("guidance").textContent = sched.audio
      ? "听脉冲，重拍就是 GO，踩在它上面按下。"
      : "看栅格，重拍就是 GO，踩在它上面按下。";
  } else {
    // Name the channel the agent is actually watching, so the human knows the
    // machine is watching the hardware and not asking to be clicked.
    $("guidance").textContent = sched.audio
      ? `听脉冲，重拍就是 GO。在那一刻完成上面的动作，机器会在 ${observedBy} 上确认。`
      : `看栅格，重拍就是 GO。在那一刻完成上面的动作，机器会在 ${observedBy} 上确认。`;
  }
  if (n === 0) {
    $("guidance").textContent = "栅格在页面就绪前就播完了，仍可按下来记录时刻。";
  }
}

function pollEvents() {
  fetch(apiURL(`/api/events?since=${S.lastSeq}`), { cache: "no-store" }).then(r => r.json()).then(d => {
    if (!d.events || !d.events.length) return;
    S.lastSeq = d.events[d.events.length - 1].seq;
    for (const e of d.events) {
      if (e.kind === "run_end") {
        $("state").textContent = "已结束 · " + (e.detail.status || "?");
        $("live").classList.remove("live");
        $("press").disabled = true;
        // Mark it finished, but let tick() decide when the tail is over.
        S.finished = S.runId;
      }
    }
  }).catch(() => {});
}

/* Long-poll for the next armed cue: the page must react the instant a cue is
   armed, including when it was opened long before it was needed.            */
function waitArmed() {
  fetch(apiURL("/api/wait-armed?timeout=25&since=" + (S.generation || 0)), { cache: "no-store" })
    .then(r => r.json())
    .then(async d => {
      if (d && d.run_id) {
        if (typeof d.generation === "number") S.generation = d.generation;
        if (d.run_id === S.runId && (S.sched || S.finished === d.run_id)) {
          // Already displaying this cue (or it has already run to completion).
          // Re-applying it would reset the press result the human is looking
          // at, replay the audio, and resurrect a finished cue's grid.
          return;
        }
        const s = await (await fetch(apiURL("/api/schedule?run_id=" + encodeURIComponent(d.run_id)), { cache: "no-store" })).json();
        // Only a LIVE run is worth rendering.  A finished one still carries its
        // beats, so rendering it blindly would bring a spent cue back to life.
        if (s && s.beats && s.beats.length && s.status === "running") { await applySchedule(s); pollEvents(); return; }
        if (s && s.run_id && s.status === "pending") {
          // armed but not started yet -- show it and offer a manual start
          S.sched = null; S.runId = s.run_id;
          document.body.classList.remove("idle");
          $("runid").textContent = s.run_id;
          $("instruction").textContent = s.instruction || "Cue ready";
          $("state").textContent = "已武装（未开始）";
          $("guidance").textContent = "提示已武装，由 agent 决定何时开始。也可现在按「立即开始」。";
          $("start").hidden = false;
        }
      }
    })
    .catch(() => {})
    .finally(() => setTimeout(waitArmed, 400));
}

/* ------------------------------------------------------------------ boot */
$("press").addEventListener("pointerdown", doPress);
$("resync").addEventListener("click", async () => { await syncClock(); if (S.sched) scheduleCue(); });
$("start").addEventListener("click", async () => {
  $("start").hidden = true;
  await fetch(apiURL("/api/start"), { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
});
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); doPress(e); }
});
addEventListener("pointerdown", () => { if (S.ac && S.ac.state === "suspended") S.ac.resume(); }, { once: true });

(async function main() {
  requestAnimationFrame(tick);
  await syncClock();
  try {
    const s = await (await fetch(apiURL("/api/schedule"), { cache: "no-store" })).json();
    if (s && s.beats && s.beats.length && s.status === "running") await applySchedule(s);
  } catch {}
  waitArmed();
  setInterval(pollEvents, POLL_MS);
  pollHealth();
  setInterval(pollHealth, 5000);
  setInterval(async () => {          // periodic re-sync; clock drift is real
    await syncClock(3);
    if (S.sched && S.sched.beats.some(b => toClient(b.at_ms) > performance.timeOrigin + performance.now())) {
      S.schedFor = null;              // force a re-schedule after the offset moved
      scheduleCue();
    }
  }, 60000);
})();

/* Button pulse, driven by the SAME beat instants the audio is scheduled from
   (through the core's toClient), so the visual cannot drift from the sound.
   Purely additive: audio stays the primary cue. */
function pulseButton(now) {
  const btn = $("press");
  if (!btn || !S.sched || !S.sched.beats.length) return;
  // When a sensor owns the evidence there is nothing to press, so there is
  // nothing to pulse.
  if (!S.panelObserved) return;
  // The press already answered the question; a button that keeps flashing
  // afterwards fights the one thing the operator still needs to read.
  if (S.finished === S.runId) return;
  let idx = -1;
  for (let i = 0; i < S.sched.beats.length; i++) {
    if (toClient(S.sched.beats[i].at_ms) <= now) idx = i; else break;
  }
  if (idx < 0 || idx === pulseButton._i) return;
  pulseButton._i = idx;
  const b = S.sched.beats[idx];
  btn.classList.toggle("go", !!b.accent);
  btn.classList.add("beat");
  clearTimeout(pulseButton._t);
  // Scale the flash to the beat interval.  A fixed 90ms is fine at 500ms but
  // at ioi 150ms consecutive flashes overlap and the button never rests.
  const ioi = S.sched.ioi_ms || 500;
  pulseButton._t = setTimeout(() => {
    btn.classList.remove("beat");
    if (!b.accent) btn.classList.remove("go");
  }, Math.max(60, Math.min(160, ioi * 0.28)));
}


/* ============================================================= shell seam */
/* Active only when hosted by a native window (?shell=desktop).

   This is the ONLY host-specific surface left in the page, and it exists for one
   reason: window chrome -- minimise, close, maximise, drag, resize, always-on-top,
   opacity, native theme -- is an operation on the OS window.  No HTTP route can
   perform it, because the process serving the API does not own the window.
   Everything else (settings, health, calibration, cue control) goes over
   ``/api/*`` in webui.py; see docs/shell-contract.md.

   Each host injects an object of async methods under its own global.  Add one
   probe below and nothing else in this file changes:

     pywebview       window.pywebview.api.<name>        (implemented)
     Tauri           window.__TAURI__.window.<name>     (adapter TODO)
     Qt/WebChannel   a registered object                (adapter TODO)
*/
const SHELL_BACKENDS = [
  ["pywebview", () => (window.pywebview && window.pywebview.api) || null],
  ["tauri", tauriShell],
];

/* Tauri exposes one `invoke(name, params)`; the seam wants named async methods,
   so this maps the positional arguments the page passes onto the parameter
   names the Rust commands declare.  Keep in step with TAURI_PARAMS' sibling:
   desktop/src-tauri/src/lib.rs. */
const TAURI_PARAMS = {
  minimize: [], close: [], toggle_maximize: [], begin_drag: [], end_drag: [],
  begin_resize: ["edge"], set_on_top: ["value"], set_opacity: ["value"],
  apply_theme: ["theme"], update_drag: ["dx", "dy"], update_resize: ["dx", "dy"],
  end_resize: [], page_note: ["text"],
};

function tauriShell() {
  const t = window.__TAURI__;
  if (!t || !t.core || typeof t.core.invoke !== "function") return null;
  const api = {};
  for (const [name, params] of Object.entries(TAURI_PARAMS))
    api[name] = (...args) =>
      t.core.invoke(name, Object.fromEntries(params.map((p, i) => [p, args[i]])));
  return api;
}

function shellAPI() {
  for (const [, probe] of SHELL_BACKENDS) { const a = probe(); if (a) return a; }
  return null;
}

/*: Which host is actually serving the seam, or null in a plain browser tab.
    Exposed for tests and for `chrono doctor` style diagnostics. */
function shellBackend() {
  for (const [name, probe] of SHELL_BACKENDS) if (probe()) return name;
  return null;
}

async function waitShell(ms) {
  const t0 = performance.now();
  while (performance.now() - t0 < (ms || 3000)) {
    const a = shellAPI();
    if (a) return a;
    await new Promise(r => setTimeout(r, 50));
  }
  return null;
}

/* Two ways to be a desktop shell: ask for it in the URL (the pywebview host and
   `chrono panel` do), or have the shell declare it.  The second exists because a
   shell that *bundles* this page owns its URL and cannot reliably attach a query
   to it (Tauri serves it as a path, not a link).  Either way the authority on
   whether window chrome exists is the seam probe below. */
const SHELL = new URLSearchParams(location.search).get("shell") === "desktop"
              || window.__CHRONO_SHELL__ === "desktop";
/*: The seam, bound once by wireShell().  Declared here, with SHELL, so every
    reference below is past its initialiser; a no-op until wireShell() runs, so
    a browser tab (no port) stays safe. */
let shellCall = async () => null;
let CFG = null;
/* NOTE: `$` comes from the timing core above.  Redeclaring it here is a
   SyntaxError for the ENTIRE script -- the page still paints, so it looks like a
   styling problem while every listener, the shell layout and the beat grid are
   silently dead.  Do not reintroduce it. */

const FIELDS = {
  "s-lead":["lead_s",parseFloat], "s-ioi":["ioi_ms",parseFloat], "s-tail":["tail_beats",parseInt],
  "s-target":["default_target_in_s",parseFloat], "s-audio":["audio_enabled",v=>v],
  "s-vol":["volume",parseFloat], "s-accent-hz":["accent_hz",parseFloat],
  "s-tick-hz":["tick_hz",parseFloat], "s-accent-ms":["accent_ms",parseFloat],
  "s-tick-ms":["tick_ms",parseFloat], "s-top":["always_on_top",v=>v],
  "s-opacity":["opacity",parseFloat], "s-remember":["remember_position",v=>v],
  "s-calo":["apply_learned_offset",v=>v],
};

/* The window paint colour, mirrored from the CSS tokens.  applyTheme() writes
   this onto <html> because the theme class lives on <body> and cannot reach
   the root element -- the root paints the 1px gutter the acrylic shows
   through.  Keep these in step with :root / .theme-light / .theme-amber. */
const WIN_RGB = { dark: "11,13,17", light: "242,243,246", amber: "20,14,4" };

//: Last degradation notice shown, so pollHealth does not rewrite the DOM every
//: 5s with the same string.
let healthDegraded = null;

function applyTheme(t) {
  document.body.classList.remove("theme-light","theme-amber");
  if (t === "light") document.body.classList.add("theme-light");
  else if (t === "amber") document.body.classList.add("theme-amber");
  // The html element paints the area the theme class (on body) cannot reach,
  // so mirror the colour onto the root explicitly.
  document.documentElement.style.setProperty("--win-rgb", WIN_RGB[t] || WIN_RGB.dark);
  for (const el of document.querySelectorAll(".sw"))
    el.setAttribute("aria-pressed", String(el.dataset.theme === (t || "dark")));
}

/* The card's alpha is *page* state, not window state.

   It used to arrive only as a side effect of Python pushing a CSS variable into
   the webview, so any host that does not own the window (Tauri) would ignore the
   opacity setting entirely -- the slider would move and nothing would change.
   The page applies it itself now; a host with a real native opacity API may
   still do more.  Keep in step with --win-alpha in the stylesheet. */
function applyOpacity(v) {
  const a = Number.isFinite(v) ? v : 1;
  document.documentElement.style.setProperty("--win-alpha", String(a));
}

function fillForm(cfg) {
  CFG = cfg || {};
  for (const [id,[key]] of Object.entries(FIELDS)) {
    const e = $(id); if (!e) continue;
    if (e.type === "checkbox") e.checked = !!CFG[key]; else e.value = CFG[key];
  }
  applyTheme(CFG.theme);
  applyOpacity(CFG.opacity);
  if (SHELL) shellCall("apply_theme", CFG.theme || "dark");
  updateLabels();
  refreshCal();
}

function updateLabels() {
  const g = (id) => ($(id) ? $(id).value : "");
  $("v-lead").textContent = g("s-lead") + " s";
  $("v-ioi").textContent = g("s-ioi") + " ms";
  $("v-tail").textContent = g("s-tail") + " 拍";
  $("v-vol").textContent = Math.round(g("s-vol") * 100) + "%";
  $("v-opacity").textContent = Math.round(g("s-opacity") * 100) + "%";
}

function collect() {
  const out = {};
  for (const [id,[key,cast]] of Object.entries(FIELDS)) {
    const e = $(id); if (!e) continue;
    out[key] = e.type === "checkbox" ? e.checked : cast(e.value);
  }
  const t = document.querySelector(".sw[aria-pressed=true]");
  if (t) out.theme = t.dataset.theme;
  return out;
}

async function refreshCal() {
  try {
    const r = await (await fetch(apiURL("/api/calibration"),{cache:"no-store"})).json();
    const items = r.items || [];
    $("cal-info").textContent = items.length
      ? "已学到 " + items.length + " 组：" + items.map(i =>
          `${i.key.split("|").pop()} ${i.offset_ms.toFixed(0)}ms (n=${i.n})`).join("；")
      : "尚无校准数据。跑完一次提示后才会出现。";
  } catch { $("cal-info").textContent = "--"; }
}

async function saveSettings() {
  const patch = collect();
  await fetch(apiURL("/api/settings"),{method:"POST",headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(patch)});
  CFG = Object.assign({}, CFG, patch);
  applyTheme(patch.theme);
  // The native chrome (DWM backdrop, immersive-dark flag, window paint colour)
  // is not CSS and is not a setting -- it is a live operation on the OS window,
  // so it goes through the shell seam even though the value was just persisted
  // over HTTP.  See docs/shell-contract.md.
  shellCall("apply_theme", patch.theme || "dark");
  flash("已保存");
}

function flash(msg) {
  const n = $("tb-name"); if (!n) return;
  n.textContent = msg;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { n.textContent = "chrono-handoff"; }, 1200);
}

function setSettings(open) {
  document.body.classList.toggle("settings-open", !!open);
}

/* ---------------------------------------------------- conductor liveness */
/* In --attach mode the conductor is another process.  If it dies, every /api
   call fails and the panel would look merely idle -- indistinguishable from
   "no cue yet", which is dangerous: the operator would wait for a countdown
   that can never arrive.  Say it out loud.                                  */
let healthOk = null;
async function pollHealth() {
  let ok = true, degraded = "";
  try {
    const r = await fetch(apiURL("/api/health"), { cache: "no-store" });
    ok = r.ok;
    if (ok) { try { degraded = ((await r.json()).degraded) || ""; } catch {} }
  } catch { ok = false; }

  // Announce a browser-tab downgrade.  The window is usually spawned detached,
  // so the stderr warning goes to a log nobody reads and the operator is left
  // thinking the project is simply a web app.
  if (degraded !== healthDegraded) {
    healthDegraded = degraded;
    const a = $("degraded");
    if (a) { a.textContent = degraded; a.hidden = !degraded; }
    document.body.classList.toggle("degraded", !!degraded);
  }

  if (ok === healthOk) return;
  healthOk = ok;
  const n = $("tb-name");
  if (n) {
    n.textContent = ok ? "chrono-handoff" : "conductor 已失联，不会有提示";
    n.classList.toggle("bad", !ok);
  }
  const dot = $("live");
  if (dot && !ok) dot.classList.remove("live");
}

/* ---------------------------------------------------------- window chrome */
function wireShell() {
  if (!SHELL) return;
  document.body.classList.add("shell");

  const call = async (name, ...args) => {
    const a = await waitShell(2000);
    // No host at all is legitimate -- a plain browser tab has no seam.
    if (!a) return null;
    const note = (m) => {
      console.error(m);
      if (typeof a.page_note === "function") { try { a.page_note(m); } catch (_) {} }
    };
    // A host that is present but lacks the command is NOT nothing: it means the
    // page and the host disagree, and returning null quietly made that look
    // exactly like success.  It cost two debugging rounds while adding
    // `page_note`, where the command existed in Rust but was missing from
    // TAURI_PARAMS, so every call was silently dropped.
    if (typeof a[name] !== "function") {
      note("shellCall: the " + shellBackend() + " host has no command '" + name + "'");
      return null;
    }
    try { return await a[name](...args); }
    catch (e) { note("shellCall " + name + " failed: " + (e && e.message || e)); return null; }
  };

  $("tb-min").addEventListener("click", () => call("minimize"));
  $("tb-max").addEventListener("click", () => call("toggle_maximize"));
  $("tb-close").addEventListener("click", () => call("close"));
  $("tb-set").addEventListener("click", () => setSettings(!document.body.classList.contains("settings-open")));
  $("s-close").addEventListener("click", () => setSettings(false));
  $("drag").addEventListener("dblclick", () => call("toggle_maximize"));

  // Window drag, title bar only.  easy_drag is OFF (it made every press a window
  // drag, including settings sliders), so this is the only way the window moves.
  // Same absolute-delta contract as the resize grips.
  $("drag").addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    const sx0 = e.screenX, sy0 = e.screenY;
    let latest = null, inFlight = false, lastSent = 0;
    const flush = async () => {
      if (inFlight || !latest) return;
      const d = latest;
      inFlight = true;
      await call("update_drag", d.dx, d.dy);
      inFlight = false;
      if (latest && (latest.dx !== d.dx || latest.dy !== d.dy)) flush();
    };
    const onMove = (ev) => {
      latest = { dx: ev.screenX - sx0, dy: ev.screenY - sy0 };
      const now = performance.now();
      if (now - lastSent > 8) { lastSent = now; flush(); }
    };
    const onUp = async () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      if (latest) await call("update_drag", latest.dx, latest.dy);
      while (inFlight) await new Promise(r => setTimeout(r, 4));
      call("end_drag");
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    call("begin_drag");
  });

  // Resize grips.
  //
  // The PAGE drives this rather than Python polling the cursor.  A polling
  // version was a race: pointerdown -> JS -> bridge -> thread start costs enough
  // that a quick flick released the button before the first poll, so fast drags
  // did nothing while slow ones worked.
  //
  // The delta sent is TOTAL since pointerdown (not per-move) and Python applies
  // it to the baseline captured at pointerdown.  Increments were a real bug:
  // Python computed baseline + this_delta, so each call overwrote the last and
  // only the final increment survived -- a 120 px drag grew the window 6 px.
  for (const g of document.querySelectorAll(".grip")) {
    g.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const sx0 = e.screenX, sy0 = e.screenY;
      let latest = null, inFlight = false, lastSent = 0;

      const flush = async () => {
        if (inFlight || !latest) return;
        const d = latest;
        inFlight = true;
        await call("update_resize", d.dx, d.dy);
        inFlight = false;
        if (latest && (latest.dx !== d.dx || latest.dy !== d.dy)) flush();
      };
      const onMove = (ev) => {
        latest = { dx: ev.screenX - sx0, dy: ev.screenY - sy0 };
        const now = performance.now();
        if (now - lastSent > 8) { lastSent = now; flush(); }
      };
      const onUp = async () => {
        g.removeEventListener("pointermove", onMove);
        g.removeEventListener("pointerup", onUp);
        g.removeEventListener("pointercancel", onUp);
        if (latest) await call("update_resize", latest.dx, latest.dy);
        while (inFlight) await new Promise(r => setTimeout(r, 4));
        call("end_resize");
      };

      // Listeners FIRST, every optional call isolated.  setPointerCapture can
      // throw InvalidPointerId for synthetic/already-released pointers, and when
      // it ran before the addEventListener calls it aborted the handler -- the
      // grip looked clickable but dragging did nothing.
      g.addEventListener("pointermove", onMove);
      g.addEventListener("pointerup", onUp);
      g.addEventListener("pointercancel", onUp);
      try { g.setPointerCapture(e.pointerId); } catch (_) { /* optional */ }
      call("begin_resize", g.dataset.grip);
    });
  }

  for (const [id] of Object.entries(FIELDS)) {
    const e = $(id); if (!e) continue;
    const ev = (e.tagName === "SELECT" || e.type === "checkbox") ? "change" : "input";
    e.addEventListener(ev, () => {
      updateLabels();
      if (id === "s-top") call("set_on_top", e.checked);
      if (id === "s-opacity") { applyOpacity(parseFloat(e.value)); call("set_opacity", parseFloat(e.value)); }
    });
  }
  for (const sw of document.querySelectorAll(".sw"))
    sw.addEventListener("click", () => {
      applyTheme(sw.dataset.theme);
      call("apply_theme", sw.dataset.theme);
    });

  $("s-save").addEventListener("click", saveSettings);
  $("s-reset").addEventListener("click", async () => {
    const r = await (await fetch(apiURL("/api/settings/reset"),{method:"POST"})).json();
    fillForm(r.settings);
    flash("已恢复默认");
  });
  $("s-test").addEventListener("click", () => {
    const ac = primeAudio(); if (ac.state === "suspended") ac.resume();
    const vol = parseFloat($("s-vol").value);
    const t0 = ac.currentTime + 0.06;
    for (let i = 0; i < 4; i++)
      tone(parseFloat($("s-tick-hz").value), parseFloat($("s-tick-ms").value)/1000, t0 + i*0.5, vol);
    tone(parseFloat($("s-accent-hz").value), parseFloat($("s-accent-ms").value)/1000, t0 + 2.0, vol);
  });

  // Page errors must not be silent.  A throw inside the panel's script leaves a
  // panel that looks merely idle, and there was nothing anywhere -- window, log,
  // or otherwise -- to say what went wrong.  Reported through the shell when
  // there is one; `console.error` still holds in a plain browser tab.
  addEventListener("error", (e) => {
    const where = (e.filename || "?") + ":" + (e.lineno || 0);
    const msg = "JS error at " + where + ": " + (e.message || e.error || "?");
    try { shellCall("page_note", msg); } catch (_) {}
    console.error(msg);
  });
  addEventListener("unhandledrejection", (e) => {
    const msg = "unhandled rejection: " + (e.reason && e.reason.message || e.reason);
    try { shellCall("page_note", msg); } catch (_) {}
    console.error(msg);
  });

  shellCall = call;

  /* ----------------------------------------------------------------
     Page-side test hook.

     WHY THIS EXISTS.  Automation on this machine cannot click the page:
     synthetic mouse input (mouse_event) drops pointermove, so a drag arrives
     as pointerdown+pointerup with no motion, and a click lands on whatever is
     coincidentally underneath.  Every pointer-driven behaviour -- the resize
     grips, the title-bar drag, the GO button -- was therefore marked SKIP, and
     "we never tested it" and "it works" looked the same in the report.

     So the events are constructed here and dispatched at the real elements.
     This is not a mock: the same listeners run, the same deltas are computed,
     the same shellCall/fetch goes out.  The only thing removed is the OS -> 
     Chromium input queue -- the one layer this machine cannot drive reliably.

     Inert unless something calls it (`if (!el) throw` rather than guessing).
     ---------------------------------------------------------------- */
  const pt = (type, o, buttons) => new PointerEvent(type, {
    bubbles: true, cancelable: true, isPrimary: true,
    pointerId: o.pointerId, pointerType: "mouse", button: 0, buttons,
    screenX: o.x, screenY: o.y, clientX: o.x, clientY: o.y,
  });

  window.__chronoPageTest = {
    // Click a real element by id.  pointerdown is what the GO button listens
    // for; click is what the title-bar buttons listen for.  Dispatch both, the
    // way a real press produces both.
    click(id) {
      const el = document.getElementById(id);
      if (!el) throw new Error("no #" + id);
      const r = el.getBoundingClientRect();
      const o = { pointerId: 11, x: r.left + r.width / 2, y: r.top + r.height / 2 };
      el.dispatchEvent(pt("pointerdown", o, 1));
      el.dispatchEvent(pt("pointerup", o, 0));
      el.dispatchEvent(new MouseEvent("click", {
        bubbles: true, cancelable: true, button: 0,
        screenX: o.x, screenY: o.y, clientX: o.x, clientY: o.y,
      }));
      return { id, rect: [r.left, r.top, r.width, r.height], disabled: !!el.disabled };
    },

    // Drag a resize grip by (dx, dy).  Moves in two steps, like a hand.
    dragGrip(edge, dx, dy) {
      const g = document.querySelector('.grip[data-grip="' + edge + '"]');
      if (!g) throw new Error("no grip " + edge);
      const o = { pointerId: 12, x: 300, y: 300 };
      g.dispatchEvent(pt("pointerdown", o, 1));
      g.dispatchEvent(pt("pointermove", { ...o, x: o.x + dx / 2, y: o.y + dy / 2 }, 1));
      g.dispatchEvent(pt("pointermove", { ...o, x: o.x + dx, y: o.y + dy }, 1));
      g.dispatchEvent(pt("pointerup", { ...o, x: o.x + dx, y: o.y + dy }, 0));
      return { edge, dx, dy };
    },

    // Drag the title bar by (dx, dy).  Its pointermove/up listeners are on
    // document, so the events have to go there.
    dragTitle(dx, dy) {
      const d = document.getElementById("drag");
      if (!d) throw new Error("no #drag");
      const o = { pointerId: 13, x: 200, y: 20 };
      d.dispatchEvent(pt("pointerdown", o, 1));
      document.dispatchEvent(pt("pointermove", { ...o, x: o.x + dx, y: o.y + dy }, 1));
      document.dispatchEvent(pt("pointerup", { ...o, x: o.x + dx, y: o.y + dy }, 0));
      return { dx, dy };
    },

    // Press GO as soon as the page actually has a cue to press for.
    //
    // Polls the page's own state rather than being told when: `doPress` refuses
    // to run unless the page holds a schedule and is the evidence source, so
    // anything firing earlier would be rejected by the very guard under test.
    // Resolves with what happened so a caller could log it; the real evidence
    // is on the conductor (`signal_seen`), which is where a press has to land.
    // Press GO, at the GO beat, once the page holds a live cue.
    //
    // Waits for `S.zeroMs` and presses *at* it rather than as soon as a schedule
    // arrives.  That is not cosmetic: the conductor ignores a press that lands
    // more than `min_offset_ms` (300 ms by default) before the cue's zero, since
    // a press that early cannot be a human answering this cue -- it is far more
    // likely a stray keystroke.  Pressing on arrival exercised nothing and got
    // silently discarded, which is exactly what happened the first time.
    //
    // Resolves with what happened.  The evidence that matters is the conductor's
    // (`signal_seen`), because that is where a press has to land.
    pressWhenArmed(timeoutMs) {
      const t0 = performance.now();
      const nowMs = () => performance.timeOrigin + performance.now();
      const note = (m) => { try { shellCall("page_note", "press: " + m); } catch (_) {} };
      let ticks = 0;
      return new Promise((resolve) => {
        const tick = () => {
          // Periodic, not only on the two outcomes: "it never fired and never
          // timed out" is otherwise indistinguishable from "the hook is missing",
          // and the state that explains it is only visible from in here.
          if (ticks++ % 25 === 0) {
            const dt = S.zeroMs ? Math.round(S.zeroMs - nowMs()) : null;
            note("waiting sched=" + !!S.sched + " observed=" + !!S.panelObserved
                 + " runId=" + S.runId + " msToZero=" + dt);
          }
          if (S.sched && S.panelObserved && !S.pressed && S.finished !== S.runId
              && S.zeroMs !== null && nowMs() >= S.zeroMs) {
            const clicked = window.__chronoPageTest.click("press");
            note("clicked GO at zero+" + Math.round(nowMs() - S.zeroMs) + "ms");
            resolve({ fired: true, clicked });
          } else if (performance.now() - t0 > timeoutMs) {
            const why = "timeout sched=" + !!S.sched + " observed=" + !!S.panelObserved
                      + " pressed=" + S.pressed + " runId=" + S.runId;
            note(why);
            resolve({ fired: false, reason: why });
          } else {
            setTimeout(tick, 60);
          }
        };
        tick();
      });
    },

    // What the page currently believes -- lets a test assert the page reacted
    // rather than only that the conductor did.
    state() {
      return {
        runId: S.runId, sched: !!S.sched, pressed: !!S.pressed,
        panelObserved: !!S.panelObserved, finished: S.finished,
        pressText: $("press").textContent, pressDisabled: $("press").disabled,
        result: $("m-result").textContent,
      };
    },
  };

  addEventListener("keydown", (e) => {
    if (e.key === "Escape") { setSettings(false); e.stopPropagation(); }
  }, true);

  // The rail's cell count does not change on resize, but the width it has to
  // fit into does -- and dragging the SE grip is the normal way to use this
  // widget, so this is a hot path, not an edge case.  Resizing smaller is
  // exactly when a rail that fitted a moment ago starts overflowing.
  addEventListener("resize", () => { fitRail(); guardClipping(); });
  if (typeof ResizeObserver !== "undefined") {
    // The window can be resized by the shell without a window resize event
    // reaching the page in every host, so watch the grid's own box too.
    new ResizeObserver(() => { fitRail(); guardClipping(); }).observe($("grid"));
  }
}

/* audible preview shares the cue's synthesis path so it sounds the same */
function tone(freq, dur, when, vol) {
  const ac = primeAudio();
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  const fade = 0.004;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(vol, when + fade);
  g.gain.setValueAtTime(vol, when + Math.max(fade, dur - fade));
  g.gain.linearRampToValueAtTime(0, when + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(when); osc.stop(when + dur + 0.02);
}

window.__chronoApplySettings = function (cfg) { fillForm(cfg); if (S.sched) scheduleCue(); };

/* A script error must be visible: otherwise a half-dead panel just looks idle,
   and the operator waits for a cue that will never come. */
window.addEventListener("error", (e) => {
  const n = $("tb-name") || $("state");
  if (n) { n.textContent = "脚本错误：" + (e.message || "unknown"); n.classList.add("bad"); }
});

window.addEventListener("DOMContentLoaded", async () => {
  wireShell();
  // Settings come over HTTP, not the shell seam: this page is served by the very
  // process that owns them (see window.py CueWindow.url).
  let cfg = null;
  try { cfg = (await (await fetch(apiURL("/api/settings"),{cache:"no-store"})).json()).settings; } catch {}
  fillForm(cfg || {});
});

</script>
</body>
</html>
