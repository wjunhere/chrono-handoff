name: CI

# 分三类，因为它们**失败的含义不同**：
#
#   core              纯标准库的计时核心。三个平台上都必须过 —— 这是"跨平台"里
#                     唯一已经有事实支撑的部分。
#   windows-ui        需要桌面会话的窗口套件（pywebview / WebView2 / 真窗口）。
#                     只有 Windows runner 有，所以只在 Windows 上跑。
#   shell-off-windows 外壳能不能在 Windows 之外**编译**。这条目前是"声明"而不是
#                     "事实"：外壳从来没在 Windows 之外构建或运行过，这个 job 的
#                     第一次运行就是它的第一次运行。它的价值正在于此。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧任务，别让排队堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Windows runner 的默认编码不是 UTF-8，而 e2e 里到处都是中文与 emoji；
  # 子进程自己再写一次（有些套件是 setdefault，这里先给上）。
  PYTHONIOENCODING: utf-8
  # 这些套件里有几条断言量的是**这台机器**的调度精度（cue 落点中位数、页面按
  # 键相对 GO 的偏移、tail 拍）。作者的机器上是 0.006–0.017 ms，共享 runner 上
  # 实测 8.067 ms 与 188.4 ms，而代码没有任何不同。置 1 后它们仍然打印数字，但
  # 不断言——因为一个因为 runner 调度而变红的构建，最后只会被人忽略。
  CHRONO_TOLERANT_TIMING: "1"

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了也要把另外两个跑完，否则拿不到完整的跨平台信号
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 而不是 3.12：实测 3.12 会让 selftest 间歇性失败（见 docs/agent-setup.md §一.0）
          python-version: "3.13"

      - name: Install
        # `.[all]` and not `.[mcp]`: this job type-checks `scripts/` as well, and the
        # window suites' scripts import `webview`, which only `.[all]` installs.  With
        # `.[mcp]` basedpyright reports eight `Import "webview" could not be resolved`
        # errors -- which is the check working, on a job that had not given it the
        # dependency it needs.  `basedpyright` does not execute these imports; it only
        # has to be able to find them.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install basedpyright

      - name: Type check
        # 0 error 是硬要求（standard 模式）。这条在任何平台上都成立，
        # 且比单测便宜得多，所以放在最前面。desktop/sidecar 也在这里面：
        # 那是构建链上的一环，而且它现在含一个自己解析 PE 头的检查。
        run: basedpyright src scripts desktop/sidecar

      - name: Self-check
        # `--tolerant-timing`: two of the ten checks compare scheduler accuracy
        # against 5 ms, which a shared runner cannot promise (measured: 19.2 ms max
        # on a hosted macOS runner, 0.006 ms on the author's machine).  They are
        # still printed with their numbers, and mark the build green only when that
        # is the *only* thing wrong.
        run: chrono selftest --tolerant-timing

      - name: Headless suites
        # 这几个只碰 HTTP 与文件系统：不开窗口、不需要显示器、不需要音频设备。
        # 窗口套件在 windows-ui 里，不在这里假装能跑。
        # e2e_update_window 也在这一组：它用 --audio null 起真 daemon，全程只有
        # HTTP/IPC，而且它验的是“要停时钟之前先问时钟”那条语义。
        shell: bash
        run: |
          set -e
          python scripts/with_deadline.py 600 python scripts/e2e_panel.py
          python scripts/with_deadline.py 600 python scripts/e2e_panel_attach.py
          python scripts/with_deadline.py 600 python scripts/e2e_state_paths.py
          python scripts/with_deadline.py 600 python scripts/e2e_update_window.py
          python scripts/with_deadline.py 600 python scripts/e2e_audio.py

      - name: The wheel must contain its UI
        # 这里曾经是 `package-data = ["statics/*.wav"]`，而 statics 下根本没有 .wav
        # 文件 —— 于是 glob 什么都没匹配到，而真正需要的 panel.html、字体、图标一个
        # 都没进包，`pip install` 之后窗口无页面可显示。真正打一次包拆开看是唯一可靠
        # 的检查。
        shell: bash
        run: |
          set -e
          pip wheel . --no-deps -w dist
          python -m zipfile -l dist/*.whl > wheel.txt
          for f in chrono_handoff/statics/panel.html \
                   chrono_handoff/statics/icon.svg \
                   chrono_handoff/statics/fonts/inter-latin.woff2; do
            if ! grep -q "$f" wheel.txt; then
              echo "::error::wheel is missing $f"
              exit 1
            fi
          done
          echo "wheel carries all three UI assets"

  windows-ui:
    name: windows window suites
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # .[all] 才有 pywebview；窗口套件缺了它会**自行跳过并返回 0**，
        # 那样这个 job 会在什么都没测的情况下变绿。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: A placeholder for the bundled conductor
        # `tauri.conf.json` declares `externalBin`, and Tauri's build script refuses to
        # build without the file: "resource path binaries/chrono-core-<triple> doesn't
        # exist".  A clean checkout therefore cannot build the shell at all -- which is
        # why this job failed the first time it ever ran.  The real file is built and
        # verified by the `sidecar` job; the window suites below launch the shell with
        # CHRONO_PYTHON and run the conductor from source, and `cargo build` does not
        # copy this placeholder next to the binary (only bundling does), so nothing
        # here ever executes it.  An empty file on purpose: if anything ever does try
        # to run it, it fails loudly instead of quietly being the wrong conductor.
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/chrono-core-$triple.exe"
          ls -l desktop/src-tauri/binaries/

      - name: Build the shell
        # `shell: bash` because of the `rm`/`||` below; the runner has Git Bash, and the
        # default here would be PowerShell, where those are not commands.
        shell: bash
        # runner 自带 Rust 工具链；没有就当场失败，而不是让下一步报一个看不懂的错
        run: |
          rustc --version
          cargo build --manifest-path desktop/src-tauri/Cargo.toml
          # `cargo build` 把 externalBin 复制到 target/debug/ 旁边（就是发布包里那个
          # 位置），于是外壳会优先找到这个空占位文件，而不是下面窗口套件传的
          # CHRONO_PYTHON —— 实测症状是 `panel :8852=False` 和 shell.json 里
          # launcher 不是 'bundled'。删掉它，外壳就会走到"源码检出"那条规则上。
          rm -f desktop/src-tauri/target/debug/chrono-core.exe
          ls -l desktop/src-tauri/target/debug/chrono-core.exe 2>/dev/null || echo "no bundled sidecar beside the dev binary (intended)"

      - name: Shell geometry tests
        # 这些是纯算式（边方向 / 夹紧 / 累计位移 / 窗口位置与恢复），不需要窗口，
        # 所以它们必须过；窗口套件里那份是"顺带也验一次"。
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Window suites
        shell: bash
        run: |
          set -e
          # Each suite gets a deadline.  A suite that hangs used to take the whole
          # job with it: one run sat here for 30 minutes and had to be cancelled,
          # which says nothing and costs hours of runner time.  The deadline runner is
          # Python because `timeout(1)` is not on macOS runners and on Windows it is a
          # different program; rc=124 names the suite that stopped answering.
          python scripts/with_deadline.py 600 python scripts/e2e_window.py
          python scripts/with_deadline.py 600 python scripts/e2e_ui_layout.py
          python scripts/with_deadline.py 600 python scripts/e2e_theme_drag.py
          python scripts/with_deadline.py 600 python scripts/e2e_split_mode.py
          python scripts/with_deadline.py 600 python scripts/e2e_daemon_window.py
          python scripts/with_deadline.py 600 python scripts/e2e_desktop_shell.py

  sidecar:
    name: frozen conductor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # .[sidecar] 而不是 .[all]：外壳的侧车**故意**不带 pywebview，
        # 那个窗口属于外壳。装多了会让「包不比源检出少会做一件事」的
        # 对等检查失去意义。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sidecar]"

      - name: Toolchain
        # build.py 要从 rustc -vV 读主机三元组（它就是输出文件名的后缀）
        run: rustc --version

      - name: Build the bundle and check it
        # 这一步就是全部：PyInstaller 把包打出来，紧接着 verify() 去找
        # 包里少了什么。PyInstaller **不能交叉编译**，所以每个平台各跑一次——
        # 也就只有在这里，「跨平台」才从声明变成事实。
        run: python desktop/sidecar/build.py

  shell-off-windows:
    name: shell compiles off Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        # Tauri 在 Linux 上要在编译期链 webkit2gtk/gtk，缺一个就是一条难读的
        # pkg-config 报错。这是 Tauri 官方列出的依赖集合。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
                                  libayatana-appindicator3-dev librsvg2-dev

      - name: Toolchain
        run: rustc --version && cargo --version

      - name: A placeholder for the bundled conductor
        # `tauri.conf.json` declares `externalBin`, and Tauri's build script refuses to
        # build without the file: "resource path binaries/chrono-core-<triple> doesn't
        # exist".  A clean checkout therefore cannot build the shell at all -- which
        # is why this job failed the first time it ever ran.  The real file is built
        # and verified by the `sidecar` job on this same platform; this job's question
        # is only "does the shell compile here", so an empty placeholder is enough and
        # nothing here runs it.
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/chrono-core-$triple"
          ls -l desktop/src-tauri/binaries/

      - name: Geometry tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build the binary
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

      - name: Report what this proves
        # 这个 job 证明"能编译能过算式测试"，**不**证明外壳能在 macOS/Linux 上跑起来：
        # 那还需要各自的侧车（PyInstaller 不能交叉编译）和真实桌面会话。
        run: |
          echo "compiled and tested on ${{ runner.os }};"
          echo "running the shell here is not covered -- it needs a per-platform"
          echo "sidecar and a real desktop session."
