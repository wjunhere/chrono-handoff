[project]
name = "chrono-handoff"
version = "0.1.0"
description = "Time-anchored human-machine action handoff: let the agent schedule, let the timer execute."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
chrono = "chrono_handoff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chrono_handoff = ["statics/*.wav"]
