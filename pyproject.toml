[project]
name = "chrono-handoff"
version = "0.1.0"
description = "Time-anchored human-machine action handoff: let the agent schedule, let the timer execute."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# Sample-accurate portable audio.  Optional: Windows uses the built-in
# winsound path, and the panel uses Web Audio in the browser.
audio = ["sounddevice>=0.4"]
# Everything needed for the full experience on any platform.
all = ["mcp>=1.0", "sounddevice>=0.4", "pywebview>=5.0", "pyserial>=3.5"]
dev = ["pytest>=7"]

[project.scripts]
chrono = "chrono_handoff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chrono_handoff = ["statics/*.wav"]
